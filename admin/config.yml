backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

# ============================================================
#  AQOON TECH — Flexible CMS
#  Collections: Articles (flexible blocks) + Team (managed)
# ============================================================

collections:
  # ----------------------------------------------------------
  #  TEAM MEMBERS — manage your writers/editors/etc here
  # ----------------------------------------------------------
  - name: "team"
    label: "👥 Kooxda (Team)"
    label_singular: "Xubin Cusub (Team Member)"
    folder: "data/team"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{name}} — {{role_so}}"
    fields:
      - { label: "Magaca (Full Name)", name: "name", widget: "string", hint: "Tusaale: Abdi Hassan" }
      - { label: "Shaqada — Af-Soomaali (Role)", name: "role_so", widget: "string", hint: "Tusaale: Tifaftiraha Guud" }
      - { label: "Role — English", name: "role_en", widget: "string", required: false, hint: "Example: Chief Editor" }
      - label: "Nooca Shaqada (Job Type)"
        name: "job_type"
        widget: "select"
        default: "writer"
        options:
          - { label: "✍️ Qoraa (Writer)", value: "writer" }
          - { label: "📝 Tifaftire (Editor)", value: "editor" }
          - { label: "🎬 Soo-saare Muuqaal (Video Producer)", value: "video" }
          - { label: "🌐 Turjubaan (Translator)", value: "translator" }
          - { label: "👑 Maamule (Admin/Founder)", value: "admin" }
      - { label: "Bio — Af-Soomaali", name: "bio_so", widget: "text", required: false }
      - { label: "Bio — English", name: "bio_en", widget: "text", required: false }
      - { label: "Sawirka (Photo)", name: "photo", widget: "image", required: false, hint: "Haddii la'aan, waxaa la isticmaali doonaa xarfaha magaca" }
      - label: "Midabka Avatar (Accent Color)"
        name: "accent"
        widget: "select"
        default: "indigo-teal"
        options:
          - { label: "Indigo → Teal", value: "indigo-teal" }
          - { label: "Teal → Bright", value: "teal-bright" }
          - { label: "Amber → Gold", value: "amber-gold" }
          - { label: "Indigo → Violet", value: "indigo-violet" }
      - { label: "Email (optional)", name: "email", widget: "string", required: false }
      - { label: "Social Link (optional)", name: "social", widget: "string", required: false }

  # ----------------------------------------------------------
  #  ARTICLES — flexible, block-based, bilingual-optional
  # ----------------------------------------------------------
  - name: "articles"
    label: "📰 Maqaallada (Articles)"
    label_singular: "Maqaal Cusub (New Article)"
    folder: "pages/articles"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title_so}}"
    fields:
      # --- Language the article is written in ---
      - label: "Luqadda Maqaalka (Article Language)"
        name: "primary_lang"
        widget: "select"
        default: "so"
        hint: "Dooro luqadda aad ku qoreyso. Haddaad labadaba qori karto, dooro 'Labada'."
        options:
          - { label: "🇸🇴 Af-Soomaali kaliya (Somali only)", value: "so" }
          - { label: "🇬🇧 English only", value: "en" }
          - { label: "🌍 Labada / Both", value: "both" }

      # --- Titles ---
      - { label: "Cinwaanka — Af-Soomaali (Somali Title)", name: "title_so", widget: "string", required: false }
      - { label: "Title — English", name: "title_en", widget: "string", required: false }
      - { label: "Sharaxaad Gaaban — Af-Soomaali (Subtitle)", name: "subtitle_so", widget: "text", required: false }
      - { label: "Subtitle — English", name: "subtitle_en", widget: "text", required: false }

      # --- Meta ---
      - label: "Nooca (Category)"
        name: "category"
        widget: "select"
        options:
          - { label: "💻 Aasaaska Teknoolajiyada", value: "tech-basics" }
          - { label: "🌐 Internet & Shabakadaha", value: "internet" }
          - { label: "📱 Mobilada & Qalabka", value: "mobile" }
          - { label: "🔒 Amniga Dijitaalka", value: "cybersecurity" }
          - { label: "🤖 AI & Teknoolajiyada", value: "ai" }
          - { label: "💼 Xirfadaha Dijitaalka", value: "digital-skills" }
          - { label: "⚙️ Barnaamijyada & Abka", value: "software" }
          - { label: "📊 Teknoolajiyada Ganacsiga", value: "business-tech" }
      - label: "Heerka (Difficulty)"
        name: "difficulty"
        widget: "select"
        default: "fudud"
        options:
          - { label: "🟢 Fudud (Beginner)", value: "fudud" }
          - { label: "🟡 Dhexdhexaad (Medium)", value: "dhexdhexaad" }
          - { label: "🔴 Adag (Advanced)", value: "adag" }
      - label: "Qoraaga (Author)"
        name: "author"
        widget: "relation"
        collection: "team"
        search_fields: ["name"]
        value_field: "name"
        display_fields: ["name"]
        hint: "Dooro qoraaga — kuwa ku jira Kooxda ayaa halkan ka soo muuqda."
      - { label: "Daqiiqo Akhrinta (Read Time, min)", name: "read_time", widget: "number", default: 5 }
      - { label: "Taariikhda (Date)", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Astaanta / Emoji (Hero Icon)", name: "hero_emoji", widget: "string", default: "📄", required: false, hint: "Hal emoji, tusaale: 🤖 🔒 📱" }
      - { label: "Sawirka Maqaalka (Hero Image, optional)", name: "hero_image", widget: "image", required: false }

      # --- The flexible body: add blocks in any order ---
      - label: "Qaybaha Maqaalka (Article Sections)"
        name: "sections"
        widget: "list"
        label_singular: "Qayb Cusub (Add Section)"
        hint: "Ku dar qaybaha aad rabto, nidaamka aad rabto. Riix '+' si aad ugu darto qayb cusub."
        types:
          # Heading
          - label: "📌 Cinwaan (Heading)"
            name: "heading"
            widget: "object"
            fields:
              - { label: "Cinwaan — Soomaali", name: "so", widget: "string", required: false }
              - { label: "Heading — English", name: "en", widget: "string", required: false }
          # Paragraph
          - label: "📝 Qoraal (Paragraph)"
            name: "paragraph"
            widget: "object"
            fields:
              - { label: "Qoraal — Soomaali", name: "so", widget: "markdown", required: false }
              - { label: "Paragraph — English", name: "en", widget: "markdown", required: false }
          # Callout / Tip
          - label: "💡 Sanduuq Talo (Callout / Tip)"
            name: "callout"
            widget: "object"
            fields:
              - { label: "Astaan (Emoji)", name: "icon", widget: "string", default: "💡" }
              - { label: "Talo — Soomaali", name: "so", widget: "text", required: false }
              - { label: "Tip — English", name: "en", widget: "text", required: false }
          # Quote
          - label: "❝ Quote (Oraah)"
            name: "quote"
            widget: "object"
            fields:
              - { label: "Quote — Soomaali", name: "so", widget: "text", required: false }
              - { label: "Quote — English", name: "en", widget: "text", required: false }
          # Bullet list
          - label: "• Liis (Bullet List)"
            name: "list"
            widget: "object"
            fields:
              - { label: "Liis — Soomaali (hal sadar = hal qodob)", name: "so", widget: "text", required: false, hint: "Mid kasta sadar gaar ah" }
              - { label: "List — English (one item per line)", name: "en", widget: "text", required: false }
          # Numbered steps
          - label: "1. Tallaabooyin (Numbered Steps)"
            name: "steps"
            widget: "object"
            fields:
              - { label: "Tallaabooyin — Soomaali (hal sadar = hal tallaabo)", name: "so", widget: "text", required: false }
              - { label: "Steps — English (one per line)", name: "en", widget: "text", required: false }
          # Code / example box
          - label: "</> Sanduuq Tusaale (Code / Example)"
            name: "code"
            widget: "object"
            fields:
              - { label: "Koodhka / Tusaalaha (Code/Example)", name: "code", widget: "text" }
              - { label: "Sharaxaad — Soomaali (optional)", name: "so", widget: "string", required: false }
              - { label: "Caption — English (optional)", name: "en", widget: "string", required: false }
          # Warning box
          - label: "⚠️ Digniin (Warning Box)"
            name: "warning"
            widget: "object"
            fields:
              - { label: "Digniin — Soomaali", name: "so", widget: "text", required: false }
              - { label: "Warning — English", name: "en", widget: "text", required: false }
          # Did you know
          - label: "🎯 Ma Ogtahay? (Did You Know)"
            name: "didyouknow"
            widget: "object"
            fields:
              - { label: "Xog — Soomaali", name: "so", widget: "text", required: false }
              - { label: "Fact — English", name: "en", widget: "text", required: false }
          # Video
          - label: "🎬 Muuqaal (Video)"
            name: "video"
            widget: "object"
            fields:
              - { label: "YouTube Link", name: "url", widget: "string", hint: "Ku dheji linkiga YouTube-ka oo dhan" }
              - { label: "Cinwaan — Soomaali", name: "so", widget: "string", required: false }
              - { label: "Caption — English", name: "en", widget: "string", required: false }
          # Image
          - label: "🖼️ Sawir (Image)"
            name: "image"
            widget: "object"
            fields:
              - { label: "Sawirka (Image)", name: "image", widget: "image" }
              - { label: "Sharaxaad — Soomaali (Caption)", name: "so", widget: "string", required: false }
              - { label: "Caption — English", name: "en", widget: "string", required: false }
          # Summary
          - label: "📋 Soo Koobid (Summary Box)"
            name: "summary"
            widget: "object"
            fields:
              - { label: "Qodobbada — Soomaali (hal sadar = hal qodob)", name: "so", widget: "text", required: false }
              - { label: "Key points — English (one per line)", name: "en", widget: "text", required: false }
