# Make sure the admin panel auth redirect works
[[redirects]]
  from = "/admin/"
  to   = "/admin/index.html"
  status = 200

# Identity callback (needed for Netlify Identity login)
[[redirects]]
  from = "/"
  to   = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}

[build]
  publish = "."
